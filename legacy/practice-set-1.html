<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Set 1 · Permutations and Combinations</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1a1a;--muted:#555;--line:#d0d0d0;--accent:#8B0000;--paper:#f7f6f2;--card:#fff;
 --green:#166534;--red:#B91C1C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Sarasa UI SC","Sarasa Gothic SC","更纱黑体","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
 background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:90px}
.serif{font-family:"Noto Serif SC","思源宋体","Songti SC",Georgia,serif}
/* ---------- 页眉：大学讲义样式 ---------- */
header{max-width:820px;margin:0 auto;padding:52px 28px 0}
.uni{font-size:12px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;font-weight:500}
h1{font-family:"Noto Serif SC","Songti SC",Georgia,serif;font-size:clamp(26px,4vw,38px);font-weight:900;margin:14px 0 4px;letter-spacing:.01em}
.subtitle{font-size:15px;color:var(--muted);font-style:italic;font-family:Georgia,serif}
.meta{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px;padding:14px 0;border-top:2px solid var(--ink);
 border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
.instructions{max-width:820px;margin:18px auto 0;padding:0 28px;font-size:13.5px;color:var(--muted);line-height:1.9}
.instructions ol{margin-left:20px}
/* ---------- 进度条 ---------- */
.bar-wrap{position:sticky;top:0;z-index:5;background:rgba(247,246,242,.92);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);padding:10px 28px;margin-top:22px}
.bar-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:16px}
.track{flex:1;height:5px;background:#e3e1db;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ink);transition:width .5s cubic-bezier(.22,1,.36,1)}
.score{font-size:12.5px;font-weight:700;letter-spacing:.05em;font-family:Georgia,serif}
/* ---------- 题目卡片 ---------- */
main{max-width:820px;margin:0 auto;padding:8px 28px}
.sec{margin:36px 0 6px;font-size:20px;font-weight:900;display:flex;align-items:baseline;gap:14px}
.sec span{font-size:12px;font-family:Georgia,serif;font-style:italic;color:var(--muted);font-weight:400;letter-spacing:.08em}
.q{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:24px 28px;margin:16px 0;
 box-shadow:0 1px 3px rgba(0,0,0,.04)}
.q-head{display:flex;gap:16px}
.q-num{font-family:Georgia,serif;font-weight:700;font-size:15px;color:var(--muted);flex:none;padding-top:2px;min-width:34px}
.q-src{font-size:11px;color:#888;margin-bottom:8px;font-family:Georgia,serif;font-style:italic;letter-spacing:.04em}
.q-en{font-size:15.5px;line-height:1.8;font-family:Georgia,"Times New Roman",serif}
.q-zh{font-size:13.5px;color:var(--muted);line-height:1.75;margin-top:8px;border-top:1px dotted var(--line);padding-top:8px}
.choices{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.choice{border:1px solid var(--line);background:#fff;border-radius:3px;padding:10px;cursor:pointer;
 font-size:15px;font-weight:500;transition:border-color .15s,background .15s;text-align:center;
 font-family:Georgia,serif}
.choice:hover{border-color:var(--ink)}
.choice.correct{background:#f0fdf4;border-color:var(--green);color:var(--green);animation:pop .35s}
.choice.wrong{background:#fef2f2;border-color:var(--red);color:var(--red);animation:shake .4s}
.choice.disabled{pointer-events:none;opacity:.6}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.ans-row{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans-input{border:none;border-bottom:1.5px solid var(--ink);background:transparent;padding:8px 4px;
 font-size:17px;width:150px;outline:none;font-family:Georgia,serif;transition:border-color .2s}
.ans-input:focus{border-color:var(--accent)}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;padding:9px 20px;
 font-size:13px;font-weight:500;cursor:pointer;letter-spacing:.06em;transition:.2s;font-family:inherit}
.btn:hover{background:#333}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink);background:#fff}
.feedback{margin-top:12px;font-weight:500;font-size:14px;min-height:20px}
.feedback.ok{color:var(--green)}.feedback.no{color:var(--red)}
.sol{margin-top:16px;border-top:1px solid var(--line);padding-top:16px;display:none}
.sol.open{display:block}
.sol h4{font-family:Georgia,serif;font-style:italic;font-size:14px;color:var(--muted);margin-bottom:12px;
 letter-spacing:.05em;font-weight:400}
.step{opacity:0;transform:translateY(12px);animation:rise .55s cubic-bezier(.22,1,.36,1) forwards;
 background:#fafaf8;border-left:2px solid var(--ink);padding:10px 16px;margin-bottom:8px;
 font-size:14px;line-height:1.85}
.step:last-of-type{border-left-color:var(--accent)}
@keyframes rise{to{opacity:1;transform:none}}
.step b{font-weight:700}
.demo{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:16px}
.demo-cap{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px;font-style:italic;font-family:Georgia,serif}
.letters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:44px;height:44px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;
 font-weight:700;font-size:19px;font-family:Georgia,serif;transition:transform .5s cubic-bezier(.22,1,.36,1);background:#fff}
.tile.hl{background:var(--ink);color:#fff}
.gridpath{stroke:#bbb;stroke-width:1}
.pathline{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.digit-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.digit{width:40px;height:40px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
 font-weight:700;font-size:16px;font-family:Georgia,serif;transition:.4s;background:#fff}
.digit.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.complete{max-width:820px;margin:26px auto 0;padding:0 28px;display:none}
.complete.show{display:block;animation:rise .6s}
.complete .card{border:2px solid var(--ink);border-radius:4px;background:#fff;padding:30px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;font-family:Georgia,serif;font-style:italic}
</style>
</head>
<body>

<header>
  <div class="uni">数学 · 竞赛训练 · 组合</div>
  <h1>练习一</h1>
  <div class="subtitle serif">排列与组合 · 基本原理</div>
  <div class="meta">
    <span>Based on <b>AoPS · Introduction to Counting and Probability</b>, Ch. 1–3</span>
    <span>共 <b>10</b> 题（基础 6 · AMC 真题 4）</span>
  </div>
</header>

<div class="instructions">
  <ol>
    <li>先独立完成全部题目，再点击「查看解析」对照分步讲解。</li>
  </ol>
</div>

<div class="bar-wrap"><div class="bar-inner">
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="score" id="score">0 / 10</div>
</div></div>

<main id="main"></main>

<div class="complete" id="complete"><div class="card">
  <div class="serif" style="font-size:22px;font-weight:900">练习一 · 已完成</div>
  <p style="color:var(--muted);font-size:13.5px;margin-top:8px" id="final-msg">已全部完成。请记录用时与错题编号，下次课逐题核对。</p>
</div></div>

<footer>练习一 · 排列与组合</footer>

<script>
const PROBLEMS=[
/* ---------- Part A · 基础 ---------- */
{sec:"A",type:"input",answer:"720",
 en:"Compute 6!.",
 zh:"计算 6 的阶乘。",
 steps:["6! = 6 × 5 × 4 × 3 × 2 × 1。",
 "从右往左乘：2×3=6，6×4=24，24×5=120，120×6 = <b>720</b>。",
 "阶乘表建议背到 7!：1, 2, 6, 24, 120, 720, 5040。竞赛中不允许计算器，这些是基本弹药。"]},

{sec:"A",type:"input",answer:"30",
 en:"In how many ways can 2 winners (1st and 2nd place) be chosen from 6 runners?",
 zh:"6 名选手中选出冠、亚军（名次有序），有多少种结果？",
 steps:["名次有序 → 排列：P(6,2)。",
 "P(6,2) = 6 × 5 = <b>30</b>。",
 "也可直接分步：冠军 6 种，亚军 5 种，乘法原理得 30。"]},

{sec:"A",type:"input",answer:"28",
 en:"Compute C(8, 2).",
 zh:"计算组合数 C(8,2)。",
 steps:["C(8,2) = 8×7 / 2! = 56 / 2 = <b>28</b>。",
 "C(n,2) = n(n−1)/2 是最常用的组合数：n 个人两两握手、n 个点两两连线，都是它。"]},

{sec:"A",type:"input",answer:"5040",
 en:"A 4-digit passcode uses digits 0–9, and no digit may repeat. How many different passcodes are possible?",
 zh:"4 位数字密码，每位 0–9，数字不重复，有多少种密码？",
 steps:["分步：第一位 10 种；用掉一个后第二位 9 种；第三位 8 种；第四位 7 种。",
 "每一步选择数稳定 → 乘法原理：10 × 9 × 8 × 7 = <b>5040</b>。",
 "即 P(10,4)。排列公式是乘法原理的速写。"]},

{sec:"A",type:"input",answer:"60",
 en:"How many distinct arrangements are there of the letters in the word BANANA?",
 zh:"BANANA 的 6 个字母有多少种不同的排法？（B 1 个，A 3 个，N 2 个）",
 steps:["假设 6 个字母全不同：6! = 720。",
 "3 个 A 互换无区别 → 每个真实排法被重复计算 3! = 6 遍；2 个 N 同理，2! = 2 遍。",
 "除以重复：720 ÷ 6 ÷ 2 = <b>60</b>。",
 "通式：n! / (n₁!·n₂!·…·nₖ!)，分母对应每种重复字母。"],
 demo:"banana"},

{sec:"A",type:"choice",choices:["24","4","1","无法确定"],answer:0,
 en:"From 10 people, we either pick 4 to stand in a line, or pick 4 to form a committee. Find the ratio P(10,4) ÷ C(10,4).",
 zh:"10 人选 4 人排队，与 10 人选 4 人组委员会，两个结果相除等于多少？",
 steps:["排队（有序）：P(10,4) = 5040。",
 "组队（无序）：C(10,4) = 210。",
 "比值 = 5040 ÷ 210 = <b>24 = 4!</b>。",
 "每种「选人」恰好对应 4! 种「排法」——组合公式分母中 k! 的意义正在于此。"]},

/* ---------- Part B · AMC 真题 ---------- */
{sec:"B",type:"input",answer:"10",
 en:"Find n such that C(n, 2) = 45.",
 zh:"已知 C(n,2) = 45，求 n。",
 steps:["C(n,2) = n(n−1)/2 = 45 → n(n−1) = 90。",
 "9 × 10 = 90，故 <b>n = 10</b>。",
 "验证：C(10,2) = 45 ✓"]},

{sec:"B",type:"choice",choices:["3","6","9","12","18"],answer:4,src:"2013 AMC 8, Problem 21",
 en:"Samantha lives 2 blocks west and 1 block south of the southwest corner of City Park. Her school is 2 blocks east and 2 blocks north of the northeast corner of City Park. On school days she bikes on streets to the southwest corner of City Park, then takes a diagonal path through the park to the northeast corner, and then bikes on streets to school. If her route is as short as possible, how many different routes can she take?",
 zh:"家到公园西南角：向西 2 段、向北 1 段；穿过公园只有 1 条对角路；东北角到学校：向东 2 段、向北 2 段。最短路线共几条？",
 steps:["第一段：排列 W, W, N → C(3,1) = <b>3</b> 条。",
 "穿过公园：唯一对角路。",
 "第二段：排列 E, E, N, N → C(4,2) = <b>6</b> 条。",
 "三段独立，乘法原理：3 × 1 × 6 = <b>18</b>。选 (E)。",
 "路径计数转化为字母排列（含重复元素），这一对应思想会反复出现。"],
 demo:"path"},

{sec:"B",type:"choice",choices:["100","120","138","140","148"],answer:2,src:"1985 AMC 8, Problem 15",
 en:"How many whole numbers between 100 and 400 contain the digit 2?",
 zh:"100 至 400 之间，含有数字 2 的整数有多少个？",
 steps:["正面分类繁琐且易重复 → 采用补集计数（complementary counting）。",
 "100–399 共 300 个数，加上 400，合计 <b>301</b>。",
 "不含 2：百位 ∈ {1,3}（2 种），十位、个位各 9 种 → 2×9×9 = 162；400 不含 2 → 共 163。",
 "301 − 163 = <b>138</b>。选 (C)。",
 "出现「含有」「至少」等词时，优先考虑反面。"]},

{sec:"B",type:"choice",choices:["245","220","200","190","255"],answer:0,src:"2017 AMC 10A, Problem 8",
 en:"At a gathering of 30 people, there are 20 people who all know each other and 10 people who know no one. People who know each other hug, and people who do not know each other shake hands. How many handshakes occur?",
 zh:"30 人聚会：20 人两两相识（拥抱），其余 10 人不认识任何人（握手）。求握手总数。",
 steps:["握手分两类：陌生人之间、陌生人与相识组之间。",
 "陌生人两两握手：C(10,2) = 45。",
 "每位陌生人与 20 人各握一次：10 × 20 = 200。",
 "加法原理：45 + 200 = <b>245</b>。",
 "AMC10 前段题的标准结构：分类 + 一个组合数。"]},

{sec:"B",type:"choice",choices:["9","10","15","21","28"],answer:2,src:"2020 AMC 8, Problem 7",
 en:"How many integers between 2020 and 2400 have four distinct digits arranged in increasing order? (For example, 2347 is one such integer.)",
 zh:"2020 至 2400 之间，各位数字互不相同且严格递增的四位数有多少个？",
 steps:["千位为 2；递增约束下百位须大于 2 且不超过 2400 的限制 → 百位只能为 3。",
 "形式固定为 23__，后两位从 {4,5,6,7,8,9} 中选取。",
 "选定 2 个数字后递增排列唯一 → 选法即答案：C(6,2) = <b>15</b>。选 (C)。",
 "表面是排列问题，实质是组合问题——识别这一层是本题的考查目的。"],
 demo:"digits"},
];

const main=document.getElementById('main');
let done=new Set();
PROBLEMS.forEach((p,i)=>{
  const q=document.createElement('div');q.className='q';
  let inner=`<div class="q-head"><div class="q-num">${String(i+1).padStart(2,'0')}.</div><div style="flex:1">
    ${p.src?`<div class="q-src">AMC · ${p.src}</div>`:''}
    <div class="q-en">${p.en}</div><div class="q-zh">${p.zh}</div></div></div>`;
  if(p.type==='choice'){
    inner+=`<div class="choices">${p.choices.map((c,j)=>`<div class="choice" data-q="${i}" data-j="${j}">${c}</div>`).join('')}</div>`;
  }else{
    inner+=`<div class="ans-row"><input class="ans-input" id="inp${i}" placeholder="答案" inputmode="numeric">
      <button class="btn" onclick="checkInput(${i})">提交</button></div>`;
  }
  inner+=`<div class="feedback" id="fb${i}"></div>
    <div class="ans-row"><button class="btn btn-ghost" onclick="toggleSol(${i})">查看解析 ▸</button></div>
    <div class="sol" id="sol${i}"><h4>分步解析</h4>
      ${p.steps.map((s,k)=>`<div class="step" style="animation-delay:${k*.3}s">${s}</div>`).join('')}
      ${p.demo?`<div class="demo" id="demo-${p.demo}"></div>`:''}
    </div>`;
  q.innerHTML=inner;main.appendChild(q);
});
/* 分节标题 */
let aT=false,bT=false;
[...main.children].forEach((el,i)=>{
  const p=PROBLEMS[i];
  if(p.sec==='A'&&!aT){aT=true;el.before(mkSec('一、基础巩固','6 题'))}
  if(p.sec==='B'&&!bT){bT=true;el.before(mkSec('二、AMC 真题','英文原题 · 4 题'))}
});
function mkSec(en,zh){const d=document.createElement('div');d.className='sec serif';
 d.innerHTML=`${en}<span>${zh}</span>`;return d}

function mark(i,ok){
  const fb=document.getElementById('fb'+i);
  fb.textContent=ok?"正确 ✓":"再想想——先判断顺序是否影响结果。";
  fb.className='feedback '+(ok?'ok':'no');
  if(ok&&!done.has(i)){done.add(i);update()}
}
function update(){
  document.getElementById('fill').style.width=(done.size/10*100)+'%';
  document.getElementById('score').textContent=done.size+' / 10';
  if(done.size===10){document.getElementById('complete').classList.add('show');
    document.getElementById('complete').scrollIntoView({behavior:'smooth'})}
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.choice');if(!c)return;
  const i=+c.dataset.q,j=+c.dataset.j;
  if(j===PROBLEMS[i].answer){c.classList.add('correct');
    [...c.parentElement.children].forEach(s=>s.classList.add('disabled'));mark(i,true)}
  else{c.classList.add('wrong');setTimeout(()=>c.classList.remove('wrong'),450);mark(i,false)}
});
function checkInput(i){
  const v=document.getElementById('inp'+i).value.replace(/[,\s]/g,'');
  mark(i,v===PROBLEMS[i].answer);
}
function toggleSol(i){
  const s=document.getElementById('sol'+i);s.classList.toggle('open');
  if(s.classList.contains('open')){
    s.querySelectorAll('.step').forEach(st=>{st.style.animation='none';st.offsetHeight;st.style.animation=''});
    const demo=s.querySelector('.demo');
    if(demo&&!demo.dataset.init){demo.dataset.init=1;initDemo(demo.id)}
  }
}
function initDemo(id){
  const el=document.getElementById(id);
  if(id==='demo-banana'){
    el.innerHTML=`<div class="demo-cap">交换两个高亮的 A，排法不变——所以要除以 3!。</div>
      <div class="letters">${'BANANA'.split('').map((l,k)=>`<div class="tile ${l==='A'?'hl':''}" id="t${k}">${l}</div>`).join('')}</div>`;
    let sw=false;
    setInterval(()=>{
      const a=document.getElementById('t1'),b=document.getElementById('t3');
      const d=b.getBoundingClientRect().left-a.getBoundingClientRect().left;
      sw=!sw;a.style.transform=sw?`translateX(${d}px)`:'none';b.style.transform=sw?`translateX(${-d}px)`:'none';
    },1600);
  }
  if(id==='demo-path'){
    el.innerHTML=`<div class="demo-cap">第一段 3 条（W,W,N 的排列）× 第二段 6 条（E,E,N,N 的排列）= 18</div>
    <svg viewBox="0 0 300 160" style="width:100%;max-width:400px;display:block;margin:0 auto">
      ${[0,1,2,3].map(x=>`<line class="gridpath" x1="${30+x*60}" y1="20" x2="${30+x*60}" y2="140"/>`).join('')}
      ${[0,1,2].map(y=>`<line class="gridpath" x1="30" y1="${20+y*60}" x2="270" y2="${20+y*60}"/>`).join('')}
      <path class="pathline" d="M30 140 L150 140 L150 80" style="animation-delay:.2s"/>
      <path class="pathline" d="M150 80 L270 80 L270 20" style="animation-delay:1s"/>
      <circle cx="30" cy="140" r="5" fill="#1a1a1a"/><circle cx="270" cy="20" r="5" fill="#8B0000"/>
      <text x="24" y="158" font-size="11" fill="#555">家</text>
      <text x="244" y="14" font-size="11" fill="#555">学校</text>
    </svg>`;
  }
  if(id==='demo-digits'){
    el.innerHTML=`<div class="demo-cap">形式固定为 23__：从 {4,5,6,7,8,9} 中选 2 个，递增排法唯一。</div>
      <div class="digit-pick">${[4,5,6,7,8,9].map(d=>`<div class="digit" data-d="${d}">${d}</div>`).join('')}</div>
      <div style="text-align:center;margin-top:10px;font-family:Georgia,serif;font-weight:700" id="dp-out">C(6,2) = 15</div>`;
    const ds=[...el.querySelectorAll('.digit')];let k=0;
    setInterval(()=>{ds.forEach(d=>d.classList.remove('on'));
      ds[k%6].classList.add('on');ds[(k+2)%6].classList.add('on');k++;},1300);
  }
}
</script>
</body>
</html>
